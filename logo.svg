<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1E293B" stroke-width="2"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0B1220"/>
    <rect width="512" height="512" fill="url(#grid)"/>
  </g>

  <!-- viewfinder corners: sharp, like UI selection handles -->
  <g fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M80 160 V80 H160"/>
    <path d="M352 80 H432 V160"/>
    <path d="M432 352 V432 H352"/>
    <path d="M160 432 H80 V352"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M176 182 V140 H226"/>
    <circle cx="234" cy="140" r="8"/>
    <path d="M256 330 V372 H306"/>
    <circle cx="314" cy="372" r="8"/>
  </g>

  <!-- JTC monogram: angular strokes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M176 196 V292 L160 308 H114"/>
    <path d="M222 196 H290 M256 196 V316"/>
    <path d="M404 196 H354 L330 220 V292 L354 316 H404"/>
  </g>
</svg>
